        body, html {

        .hero-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            /* Replace with your hosted image URL if deploying online */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 30px 20px;
        }


        .content-overlay {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-bottom: 20px;
        }

        .event-date {
            color: #f3e5ab;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .search-box-wrapper {
            width: 100%;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1rem;
            border: 2px solid #d4af37;
            border-radius: 30px;
            background-color: rgba(255, 255, 255, 0.95);
            color: #333;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #fff;
            background-color: #fff;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .results-container {
            width: 100%;
            max-height: 280px;
            overflow-y: auto;
            text-align: left;
            display: none;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-left: 5px solid #d4af37;
            animation: fadeIn 0.3s ease;
        }

        .result-table {
            font-size: 1.1rem;
            font-weight: bold;
            color: #4a1525;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-badge {
            background-color: #4a1525;
            color: #f3e5ab;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .result-group {
            font-size: 0.95srem;
            color: #555;
            line-height: 1.4;
        }

        .no-results {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            color: #4a1525;
            text-align: center;
            font-weight: 500;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

        function handleSearch() {
            const query = document.getElementById('guestSearch').value.toLowerCase().trim();
            const resultsDiv = document.getElementById('results');

            if (query.length === 0) {
                resultsDiv.style.display = 'none';
                resultsDiv.innerHTML = '';
                return;
            }

            // Filter matches based on guest name or names included in their group string
            const matches = seatingData.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.group.toLowerCase().includes(query)
            );

            // Deduplicate results based on table and group combination
            const uniqueResults = [];
            const seen = new Set();
            matches.forEach(m => {
                const identifier = m.table + '-' + m.group;
                if (!seen.has(identifier)) {
                    seen.add(identifier);
                    uniqueResults.push(m);
                }
            });

            resultsDiv.style.display = 'block';

            if (uniqueResults.length > 0) {
                let html = '';
                uniqueResults.forEach(match => {
                    html += `
                        <div class="result-card">
                            <div class="result-table">
                                <span>${match.table}</span>
                                <span class="table-badge">Assigned</span>
                            </div>
                            <div class="result-group"><strong>Party / Members:</strong> ${match.group}</div>
                        </div>
                    `;
                });
                resultsDiv.innerHTML = html;
            } else {
                resultsDiv.innerHTML = `<div class="no-results">No guest found matching "${query}". Please check the spelling or try searching by family/group name.</div>`;
            }
        }
