        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #4a1525; /* Fallback color matching theme */
        }

        .hero-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 40px 20px;
        }

        .content-overlay {
            position: relative;
            width: 100%;
            max-width: 600px;
            background: rgba(74, 21, 37, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #fff;
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #d4af37;
            margin-bottom: 5px;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: #f3e5ab;
            margin-bottom: 25px;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            border-radius: 30px;
            border: 1px solid #d4af37;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .results-container {
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 15px;
            border-radius: 10px;
            text-align: left;
        }

        .result-item {
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-item:hover {
            background: rgba(212, 175, 55, 0.25);
            border-left: 4px solid #d4af37;
        }

        .result-item span.hint {
            font-size: 0.8rem;
            color: #f3e5ab;
            opacity: 0.7;
        }

        /* Table Card Pop-up */
        .table-card {
            display: none;
            background: linear-gradient(135deg, #2c0b14 0%, #4a1525 100%);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 25px;
            margin-top: 15px;
            animation: fadeIn 0.4s ease-in-out;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            text-align: left;
        }

        .table-card h3 {
            color: #d4af37;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .table-card .table-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            margin: 8px 0;
            letter-spacing: 1px;
        }

        .table-card .party-info {
            color: #f3e5ab;
            font-size: 0.9rem;
            margin-top: 8px;
            line-height: 1.4;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar styling */
        .results-container::-webkit-scrollbar {
            width: 6px;
        }
        .results-container::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.4);
            border-radius: 3px;
        }
    </style>

        function filterNames() {
            const input = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('resultsContainer');
            const tableCard = document.getElementById('tableCard');
            
            // Hide card when typing a new search
            tableCard.style.display = 'none';
            resultsContainer.innerHTML = '';

            if (input === '') {
                return;
            }

            const matchedGuests = guestDatabase.filter(guest => 
                guest.name.toLowerCase().includes(input) ||
                guest.group.toLowerCase().includes(input)
            );

            // Deduplicate by name/table combo
            const uniqueResults = [];
            const seen = new Set();
            matchedGuests.forEach(g => {
                const key = g.name + '-' + g.table;
                if (!seen.has(key)) {
                    seen.add(key);
                    uniqueResults.push(g);
                }
            });

            if (uniqueResults.length === 0) {
                resultsContainer.innerHTML = '<div class="result-item" style="justify-content:center; color: rgba(255,255,255,0.6);">No matching guest found</div>';
                return;
            }

            uniqueResults.forEach(guest => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `<span>${guest.name}</span> <span class="hint">Click to view table</span>`;
                
                // Add click listener to show table assignment
                item.onclick = function() {
                    showTableAssignment(guest.name, guest.table, guest.group);
                };

                resultsContainer.appendChild(item);
            });
        }

        function showTableAssignment(name, table, group) {
            document.getElementById('guestNameDisplay').innerText = name;
            document.getElementById('tableNumberDisplay').innerText = table;
            document.getElementById('partyDisplay').innerHTML = `<strong>Party Members:</strong> ${group}`;
            document.getElementById('tableCard').style.display = 'block';
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('searchInput').value = name;
        }
